name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22: the jsdom of the dialog simulation (tests/dialog-sim) needs it.
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm ci
        env:
          # Sem hooks do husky no runner (o prepare só serve para o commit local).
          HUSKY: '0'

      - name: Build
        run: npm run build

      - name: Checar tipos sem subir o número de erros
        run: node scripts/tsc-ceiling.mjs

      # Dentro do job build, que a proteção da main já exige: um teste quebrado barra o merge.
      - name: Testes de lógica
        run: npm test

      - name: Simulação dos diálogos
        run: npm run test:sim
